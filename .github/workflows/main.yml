name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main

jobs:
    test-build-deploy:
        runs-on: ubuntu-latest
        env:
            # Fine-grained PAT with Actions: write on FS-Frost/fs-frost. Profile sync is skipped if unset.
            PROFILE_DISPATCH_TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2.0.2
              with:
                bun-version: latest

            - name: Install dependencies
              run: |
                  bun install

            - name: Svelte sync
              run: |
                  bun check

            # - name: Run tests
            #   run: |
            #       bun test

            - name: Build
              run: |
                  bun run build

            - name: Change base-tag in index.html from / to mai-tools
              run: sed -i 's/<base href="\/" \/>/<base href="\/mai-tools\/" \/>/g' build/index.html

            - name: Generate build info
              run: |
                  echo "{\"sha\": \"${{ github.sha }}\", \"ref\": \"${{ github.ref_name }}\", \"actor\": \"${{ github.actor }}\", \"repo\": \"${{ github.event.repository.name }}\"}" > build/build-info.json

            - name: Generate .nojekyll
              run: |
                  echo "" > build/.nojekyll

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@4.1.7
              with:
                  branch: gh-pages
                  folder: build

            # The profile README reads the published tools.json, so wait until Pages serves this build's copy.
            - name: Wait for tools.json on GitHub Pages
              if: env.PROFILE_DISPATCH_TOKEN != ''
              run: |
                  for i in $(seq 1 20); do
                      if curl -sf https://fs-frost.github.io/mai-tools/tools.json | cmp -s - build/tools.json; then
                          echo "tools.json is published"
                          exit 0
                      fi
                      sleep 15
                  done
                  echo "tools.json was not published after 5 minutes" >&2
                  exit 1

            - name: Update GitHub profile README
              if: env.PROFILE_DISPATCH_TOKEN != ''
              env:
                  GH_TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
              run: gh workflow run readme.yml -R FS-Frost/fs-frost
